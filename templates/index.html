<!DOCTYPE html>
<html>
<head>
<title>AI Course Recommendation</title>
</head>
<body>

<h1>AI Course Recommendation</h1>

<textarea id="text" rows="8" cols="60" placeholder="Enter your skills or interests..."></textarea>
<br><br>

<button onclick="getRecommendations()">Recommend</button>

<h2>Recommended Courses:</h2>
<div id="results"></div>

<script>
       async function getRecommendations() {
           const text = document.getElementById("text").value;
           const resultsDiv = document.getElementById("results");

           resultsDiv.innerHTML = "Loading...";

           const response = await fetch("/api/recommend", {
               method: "POST",
               headers: {
                   "Content-Type": "application/json"
               },
               body: JSON.stringify({ text: text })
           });

           const data = await response.json();

           if (data.error) {
               resultsDiv.innerHTML = data.error;
               return;
           }

           resultsDiv.innerHTML = "";

           if (data.recommendations.length === 0) {
               resultsDiv.innerHTML = "No related courses found.";
               return;
           }

           data.recommendations.forEach(course => {
               resultsDiv.innerHTML += `
<div>
<h3>${course.title}</h3>
<p>${course.description}</p>
</div>
<hr>
               `;
           });
       }
</script>

</body>
</html>
