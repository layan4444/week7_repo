<!DOCTYPE html>

 

<html>

 

<head>

 

    <title>Skills Recommendation System</title>

 

    <style>

 

        body {

 

            font-family: Arial;

 

            backgroupythonnd: #f4f4f4;

 

            text-align: center;

 

        }

 

 

 

        .container {

 

            margin-top: 100px;

 

        }

 

 

 

        textarea {

 

            width: 400px;

 

            height: 120px;

 

        }

 

 

 

        button {

 

            padding: 10px 20px;

 

            margin-top: 10px;

 

            cursor: pointer;

 

        }

 

 

 

        .result {

 

            margin-tpythonop: 20px;

 

            background: white;

 

            padding: 20px;

 

            display: inline-block;

 

        }

 

    </style>

 

</head>

 

<body>

 

 

 

<div class="container">

 

    <h1>AI Course Recommendation</h1>

 

 

 

    <textarea id="text" placeholder="Enter your skills or interests..."></textarea>

 

    <br>

 

    <button onclick="sendData()">Recommend</button>

 

 

 

    <div class="result" id="result"></div>

 

</div>

 

 

 

<script>

 

function sendData() {

 

    const text = document.getElementById("text").value;

 

 

 

    fetch("/api/recommend", {

 

        method: "POST",

 

        headers: {

 

            "Content-Type": "application/json"

 

        },

 

        body: JSON.stringify({text: text})

 

    })

 

    .then(res => res.json())

 

    .then(data => {

 

        let output = "<h3>Skills:</h3>" + data.skills.join(", ");

 

 

 

        output += "<h3>Recommendations:</h3>";

 

 

 

        data.recommendations.forEach(c => {

 

            output += `<p><b>${c.course}</b> : ${c.score.toFixed(2)}</p>`;

 

        });

 

 

 

        document.getElementById("result").innerHTML = output;

 

    });

 

}

 

</script>

 

 

 

</body>

 

</html>
